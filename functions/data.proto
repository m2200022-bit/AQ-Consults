// الحقول اللازمة فقط من حدث Firestore (google.events.cloud.firestore.v1.DocumentEventData)
syntax = "proto3";
package aq;
message DocumentEventData { Document value = 1; Document old_value = 2; }
message Document { string name = 1; map<string, Value> fields = 2; }
message Value {
  oneof value_type {
    bool boolean_value = 1;
    int64 integer_value = 2;
    double double_value = 3;
    string string_value = 17;
  }
}
