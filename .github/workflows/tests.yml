name: اختبارات النظام

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    name: الدالة والنسخ الاحتياطي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: تثبيت مكتبات الدالة
        run: npm install --no-audit --no-fund
        working-directory: functions
      - name: اختبار دالة الإشعارات
        run: node tests/fn/test.js
        env:
          AQ_TEST: '1'
      - name: اختبار النسخ الخارجي المشفّر
        run: node tests/backup/test.mjs

  rules:
    name: قواعد الأمان
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: تثبيت أدوات المحاكي
        run: npm install --no-audit --no-fund
        working-directory: tests/rules
      - name: اختبار القواعد على محاكي Firestore
        run: |
          set -o pipefail
          cp ../../firestore.rules .
          npx firebase emulators:exec --only firestore --project demo-aq "node test.mjs" 2>&1 | tee rules.log || {
            grep -E "FAIL|Error|error" rules.log | head -25 | sed 's/^/::error::/'
            exit 1
          }
        working-directory: tests/rules

  ui:
    name: واجهة النظام
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: تثبيت المتصفح
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: تنزيل مكتبة الأيقونات (نفس نسخة الموقع)
        run: curl -sSL https://unpkg.com/lucide@latest/dist/umd/lucide.min.js -o tests/ui/lucide.js
      - name: اختبار الواجهة كاملة
        run: |
          set -o pipefail
          python tests/ui/check.py 2>&1 | tee ui.log || { grep -E "FAIL|Error" ui.log | head -25 | sed 's/^/::error::/'; exit 1; }
        env:
          AQ_SHOTS: ${{ runner.temp }}/shots
      - name: حفظ لقطات الشاشة عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
