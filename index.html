<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الاستشارات — مكتب الدكتور عقيل محمد المقطري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Beiruti:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ملاحظة: طلب استخدام "خط الوتد" (وزارة الثقافة) و"DG Forsha" (خط فرشة) — كلاهما خطوط تُحمَّل كملفات (TTF) وليست متاحة عبر Google Fonts أو أي CDN عام،
   لذلك تعذّر تضمينهما تلقائياً هنا. تم استخدام خط "Aref Ruqaa" (خط عربي بطابع خط اليد/الفرشاة) للعناوين كبديل مقارب حتى تزوّدني بملفات الخطوط الفعلية (TTF/WOFF) لتضمينها مباشرة عبر @font-face.
   ملاحظة إضافية: تم تعيين خط "Sakkal Majalla" كخط أساسي للموقع بناءً على الطلب. هذا الخط مرفق مع نظام Windows/Office وليس متاحاً عبر أي CDN عام لتضمينه في المتصفح مباشرة،
   لذلك سيظهر تلقائياً فقط لدى من يفتح الصفحة على جهاز يحتوي هذا الخط مثبتاً (وهو شائع جداً على أجهزة Windows)، وإلا سيعود المتصفح تلقائياً للخط البديل التالي في القائمة. إن أرسلت لي ملف الخط (TTF/OTF) يمكن تضمينه عبر @font-face ليظهر للجميع دون الحاجة لتثبيته. */
:root{
  --bg:#F6F2E8; --surface:#FFFFFF; --surface-2:#FBF8F1;
  --ink:#1E241F; --ink-soft:#5B6660; --ink-faint:#8B9088; --border:#E3DCC8;
  --primary:#7A1F2E; --primary-light:#93283C; --primary-100:#F5E6E8;
  --gold:#B4863A; --gold-100:#F7EEDC;
  --urgent:#AE3A31; --urgent-100:#F8E7E4;
  --overdue:#9C2E26; --overdue-100:#F6E1DE;
  --blue:#2A5695; --blue-100:#E8EEF7;
  --normal:#2E7A52; --normal-100:#E7F2EB;
  --archived:#8A8577; --archived-100:#EEECE4;
  --apology:#7A4C8C; --apology-100:#F1E7F5;
  --radius:14px;
  --shadow: 0 1px 2px rgba(30,36,31,0.04), 0 4px 16px rgba(30,36,31,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:'Sakkal Majalla','Tajawal',sans-serif; min-height:100vh; overflow-x:hidden;}
.app{display:flex; min-height:100vh;}
.sidebar{width:250px; flex:0 0 250px; background:var(--primary); color:#EFF5F1; display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
.brand-seal{width:40px; height:40px; border-radius:50%; border:2px dashed rgba(239,245,241,0.55); display:flex; align-items:center; justify-content:center; font-family:'Sakkal Majalla','Amiri',serif; font-weight:700; font-size:15px; flex:0 0 40px;}
.brand-logo{width:40px; height:40px; border-radius:50%; object-fit:cover; flex:0 0 40px; background:#fff;}
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg, var(--primary) 0%, #4a1420 55%, var(--bg) 55%);}
.login-card{background:var(--surface); border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.25); padding:44px 40px; width:100%; max-width:440px; text-align:center;}
.login-logo{width:92px; height:92px; border-radius:50%; object-fit:cover; margin:0 auto 16px; display:block; border:3px solid var(--primary-100);}
.login-seal{width:92px; height:92px; margin:0 auto 16px; border:2px dashed var(--primary); color:var(--primary); font-size:28px;}
.login-card h1{font-family:'Sakkal Majalla','Aref Ruqaa',serif; color:var(--blue); font-size:30px; margin:0 0 6px;}
.login-card .muted{font-size:14.5px;}
.login-error{background:var(--urgent-100); color:var(--urgent); border-radius:8px; padding:9px 11px; font-size:13.5px; margin:11px 0;}
.login-card input{text-align:right; font-size:16px; padding:12px 14px;}
.login-card label{font-size:14.5px;}
.login-card .btn{font-size:16.5px; padding:13px 20px;}
.brand-text{font-family:'Sakkal Majalla','Aref Ruqaa',serif; font-weight:700; font-size:17.5px; line-height:1.4;}
.brand-text small{display:block; font-family:'Sakkal Majalla','Tajawal',sans-serif; font-weight:400; font-size:11px; color:rgba(239,245,241,0.68);}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:rgba(239,245,241,0.82); text-decoration:none; font-size:17px; cursor:pointer; border:none; background:transparent; text-align:right; width:100%; font-family:inherit; position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:rgba(255,255,255,0.14); color:#fff; font-weight:700;}
.nav-badge{margin-right:auto; background:linear-gradient(135deg,#ffd873 0%, #e0a530 100%); color:#000; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1;}
.nav-sep{height:1px; background:rgba(255,255,255,0.12); margin:12px 4px;}
.sidebar-foot{margin-top:auto; font-size:11px; color:rgba(239,245,241,0.5); padding:0 8px;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 26px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;}
.topbar-title{font-size:19px; font-weight:900; font-family:'Sakkal Majalla','Aref Ruqaa',serif; color:var(--blue);}
.topbar-right{display:flex; align-items:center; gap:14px;}
.role-switch{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px;}
.role-btn{border:none; background:transparent; padding:6px 14px; border-radius:999px; font-family:inherit; font-size:13px; cursor:pointer; color:var(--ink-soft);}
.role-btn.active{background:var(--primary); color:#fff; font-weight:700;}
.who-tag{font-size:12.5px; color:var(--ink-soft);}
.content{padding:24px 26px; flex:1; min-width:0;}
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-bottom:18px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; box-shadow:var(--shadow);}
.stat-card .num{font-size:19px; font-weight:900; font-family:'Sakkal Majalla','Amiri',serif;}
.stat-card .lbl{font-size:10.5px; color:var(--ink-soft); margin-top:1px;}
.stat-card.accent-urgent .num{color:var(--urgent);}
.stat-card.accent-normal .num{color:var(--normal);}
.stat-card.accent-gold .num{color:var(--gold);}
.stat-card.accent-blue .num{color:var(--blue);}
.stat-card.accent-apology .num{color:var(--apology);}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px;}
.panel-head h3{margin:0; font-size:20px; font-family:'Sakkal Majalla','Aref Ruqaa',serif; font-weight:700; color:var(--blue);}
.panel-body{padding:16px 18px;}
.btn{border:none; border-radius:10px; padding:9px 16px; font-family:inherit; font-size:13.5px; cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold); color:#fff;}
.btn-outline{background:transparent; color:var(--primary); border:1px solid var(--primary);}
.btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
.btn-danger{background:var(--urgent-100); color:var(--urgent);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:0.5; cursor:not-allowed;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:700;}
input[type=text],input[type=date],input[type=email],textarea,select{width:100%; border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-family:inherit; font-size:13.5px; color:var(--ink); background:#fff;}
textarea{resize:vertical; min-height:90px;}
.field{margin-bottom:14px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid-5{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
.checks{display:flex; flex-wrap:wrap; gap:8px;}
.chip-check{display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; background:#fff;}
.chip-check.checked{border-color:var(--primary); background:var(--primary-100); color:var(--primary); font-weight:700;}
.dropzone{border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; color:var(--ink-soft); font-size:13px; background:var(--surface-2); cursor:pointer;}
.dropzone.drag{border-color:var(--primary); background:var(--primary-100);}
.file-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.file-thumb{width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border); position:relative; background:#fff;}
.file-thumb img{width:100%; height:100%; object-fit:cover;}
.file-thumb .pdf-tag{display:flex; align-items:center; justify-content:center; height:100%; font-size:11px; color:var(--ink-soft);}
.stamp{display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; border-radius:999px; border:1.5px dashed currentColor; font-family:'Sakkal Majalla','Amiri',serif; font-weight:700; font-size:12.5px;}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 7px;}
.stamp.st-new{color:var(--primary); background:var(--primary-100);}
.stamp.st-urgent-pending{color:var(--urgent); background:var(--urgent-100);}
.stamp.st-overdue{color:var(--overdue); background:var(--overdue-100);}
.stamp.st-answered{color:var(--blue); background:var(--blue-100);}
.stamp.st-approved{color:var(--normal); background:var(--normal-100);}
.stamp.st-printing{color:var(--gold); background:var(--gold-100);}
.stamp.st-archived{color:var(--archived); background:var(--archived-100);}
.stamp.st-apology{color:var(--apology); background:var(--apology-100);}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft);}
.pill.urgent{color:var(--urgent); border-color:var(--urgent-100); background:var(--urgent-100);}
.pill.normal{color:var(--normal); border-color:var(--normal-100); background:var(--normal-100);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:right; color:var(--ink-soft); font-size:12px; font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:18px; font-weight:700; font-family:'Sakkal Majalla','Amiri',serif;}
.table-panel-outlined{border:2px solid var(--primary); border-radius:12px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.table-panel-outlined table th{border-bottom:1px solid var(--primary);}
.table-panel-outlined table td{border-bottom:1px dashed var(--border);}
.table-panel-outlined table tr:last-child td{border-bottom:none;}
.stat-cards-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:20px;}
.stat-card-v3{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); font-family:'Beiruti','Tajawal',sans-serif; font-weight:600;}
.scv3-top{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px;}
.scv3-icon{width:28px; height:28px; min-width:28px; border-radius:50%; background:linear-gradient(135deg,#ffd873 0%, #e0a530 100%); display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 2px 6px rgba(224,165,48,.4);}
.scv3-title{font-size:11px; font-weight:700; color:#1a1a1a; text-align:right; line-height:1.3;}
.scv3-number{font-size:20px; font-weight:600; color:#111; margin-bottom:2px; font-family:'Beiruti','Tajawal',sans-serif;}
.scv3-sub{font-size:9.5px; color:#9a9a9a; font-weight:700;}
@media (max-width:900px){.stat-cards-grid{grid-template-columns:repeat(3, 1fr);}}
@media (max-width:600px){.stat-cards-grid{grid-template-columns:1fr 1fr;}}
.suggestion-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.suggestion-item{display:flex; align-items:center; gap:8px; padding:10px 8px; border-bottom:1px dashed var(--border);}
.suggestion-item:last-child{border-bottom:none;}
.suggestion-bullet{color:var(--primary); font-size:20px; line-height:1;}
.suggestion-text{flex:1; font-size:14px;}
.suggestion-edit-input{flex:1;}
.suggestion-actions{display:flex; gap:4px;}
.number-badge{display:inline-block; background:linear-gradient(135deg,var(--primary) 0%, #0a4a42 100%); color:#fff; font-size:19px; font-weight:800; padding:5px 14px; border-radius:8px; letter-spacing:.5px; box-shadow:0 2px 6px rgba(0,0,0,.15);}
.number-badge-inline{display:inline-block; background:var(--primary); color:#fff; font-weight:800; font-size:16px; padding:1px 9px; border-radius:6px; margin:0 2px;}
.closed-meta{font-size:11px; color:var(--urgent); font-weight:700; margin-top:3px;}
.report-table-wrap{border:1px solid var(--border); border-radius:12px; overflow-x:auto; margin-top:14px; -webkit-overflow-scrolling:touch;}
.report-table{width:100%; border-collapse:collapse;}
.report-table th{background:#2f6fed; color:#fff; text-align:center; font-size:13px; font-weight:700; padding:10px 8px; border-left:1px dashed rgba(255,255,255,.4);}
.report-table th:last-child{border-left:none;}
.report-table td{text-align:center; padding:10px 8px; font-size:14px; font-weight:600; border-bottom:1px solid var(--border); border-left:1px dashed var(--border);}
.report-table td:last-child{border-left:none;}
.report-table tr:last-child td{border-bottom:none;}
.report-table tr:nth-child(even) td{background:var(--surface-2);}
.table-cell-input{width:100%; border:none; background:transparent; font-size:14px; font-weight:600; text-align:center; padding:4px; font-family:inherit; color:inherit;}
.table-cell-input:focus{outline:2px solid var(--primary); border-radius:6px; background:#fff;}
.table-cell-textarea{min-height:90px; text-align:right; resize:vertical; font-size:18px !important;}
.dup-number-warning{color:var(--urgent); font-size:11px; font-weight:700; margin-top:4px;}
.report-total-row{padding:12px 16px; text-align:left; font-size:16px; font-weight:800; background:var(--surface-2); border-top:1px solid var(--border);}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:var(--surface-2);}
.muted{color:var(--ink-faint); font-size:12px;}
.searchbar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:16px;}
.searchbar .field{margin-bottom:0; min-width:150px;}
.searchbar .field.grow{flex:1; min-width:220px;}
.modal-overlay{position:fixed; inset:0; background:rgba(20,24,20,0.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:420px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal .modal-seal{width:56px; height:56px; margin:0 auto 14px; border-radius:50%; border:2px dashed var(--gold); display:flex; align-items:center; justify-content:center; font-size:24px;}
.modal h3{margin:0 0 8px; font-family:'Sakkal Majalla','Aref Ruqaa',serif; font-size:20px; color:var(--blue);}
.modal p{color:var(--ink-soft); font-size:13.5px; margin:0 0 18px;}
.detail-grid{display:block;}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} .grid-5{grid-template-columns:1fr 1fr;} .sidebar{position:fixed; z-index:20; height:100vh; transform:translateX(100%); transition:.2s;} .sidebar.open{transform:translateX(0);} .app{display:block;}}
.img-viewer{background:var(--ink); border-radius:12px; overflow:hidden; position:relative; min-height:320px; display:flex; align-items:center; justify-content:center;}
.img-viewer img{max-width:100%; max-height:560px; transition:transform .15s;}
.img-toolbar{position:absolute; bottom:10px; right:10px; display:flex; gap:6px;}
.img-toolbar button{width:32px; height:32px; border-radius:8px; border:none; background:rgba(255,255,255,0.9); cursor:pointer; font-size:14px;}
.thumb-strip{display:flex; gap:6px; margin-top:8px; overflow-x:auto;}
.thumb-strip img{width:52px; height:52px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent;}
.thumb-strip img.active{border-color:var(--gold);}
.timeline{list-style:none; margin:0; padding:0; border-right:2px solid var(--border); margin-right:6px;}
.timeline li{position:relative; padding:0 18px 16px 0;}
.timeline li::before{content:''; position:absolute; right:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--primary);}
.timeline li .t-action{font-weight:700; font-size:13px;}
.timeline li .t-meta{color:var(--ink-faint); font-size:11.5px; margin-top:2px;}
.kv{display:grid; grid-template-columns:120px 1fr; gap:7px 10px; font-size:18px; font-weight:700; font-family:'Sakkal Majalla','Amiri',serif; margin-bottom:4px;}
.kv-highlight{background:var(--gold-100); border:1px solid var(--gold); border-radius:10px; padding:10px 12px;}
.info-bar{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; margin-bottom:16px; padding:12px 16px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;}
.info-bar .info-item{display:flex; align-items:baseline; gap:6px; font-size:15.5px; font-weight:700; font-family:'Sakkal Majalla','Amiri',serif;}
.info-bar .info-item b{color:var(--ink-soft); font-weight:700; font-size:11.5px; font-family:'Sakkal Majalla','Tajawal',sans-serif;}
.detail-title-actions{display:flex; align-items:center; gap:6px;}
.icon-link{border:none; background:transparent; cursor:pointer; font-size:15px; padding:4px 6px; border-radius:6px; color:var(--ink-soft);}
.icon-link:hover{background:var(--surface-2); color:var(--primary);}
.icon-link.danger:hover{color:var(--urgent);}
.kv b{color:var(--ink-soft); font-weight:700; font-size:12.5px;}
.bars{display:flex; flex-direction:column; gap:10px;}
.bar-row{display:flex; align-items:center; gap:10px; font-size:13px;}
.bar-row .bar-label{width:130px; flex:0 0 130px; color:var(--ink-soft);}
.bar-track{flex:1; height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; background:var(--primary); border-radius:99px;}
.bar-row .bar-num{width:26px; text-align:left; font-weight:700;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-faint);}
.empty .e-icon{font-size:30px; margin-bottom:8px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:100; box-shadow:var(--shadow);}
.hidden{display:none !important;}
.notice-banner{background:var(--gold-100); border:1px solid var(--gold); color:#7A5A22; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.notice-critical{background:var(--urgent-100); border-color:var(--urgent); color:var(--urgent); font-weight:700;}
.notice-answered{background:#e7f7ef; border-color:#2f9e6f; color:#0a5c3f; font-weight:700;}
tr.row-urgent-full td{background:#fbe4e4 !important;}
tr.row-urgent-full:hover td{background:#f8d5d5 !important;}
tr.row-urgent-full td:first-child{border-right:4px solid var(--urgent);}
tr.row-normal-open td{background:#e7f7ef !important;}
tr.row-normal-open:hover td{background:#d9f2e5 !important;}
tr.row-normal-open td:first-child{border-right:4px solid #2f9e6f;}
.btn-outline-danger{background:#fff; border:1.5px solid var(--urgent); color:var(--urgent);}
.mobile-toggle{display:none; border:none; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:36px; height:36px; font-size:16px; cursor:pointer;}
@media(max-width:900px){.mobile-toggle{display:block;}}

<body>
<div class="app" id="app"></div>
<script type="module">
/* ===================== FIREBASE ===================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
let getAnalytics = null;
try{
  ({ getAnalytics } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js"));
}catch(e){ /* analytics may be blocked (ad-blockers) — app works fine without it */ }

const firebaseConfig = {
  apiKey: "AIzaSyDUDzOYvFnChyU3QU81RapJ7wG5VtzG0tU",
  authDomain: "aq-consults.firebaseapp.com",
  databaseURL: "https://aq-consults-default-rtdb.firebaseio.com",
  projectId: "aq-consults",
  storageBucket: "aq-consults.firebasestorage.app",
  messagingSenderId: "1006318779836",
  appId: "1:1006318779836:web:d73eacdb83dea69e1abfb9",
  measurementId: "G-4RCC6TWBNX"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
try{ if(getAnalytics) getAnalytics(fbApp); }catch(e){ /* ignore */ }
const APP_STATE_COLLECTION = 'app_state';

/* ===================== EMAIL NOTIFICATIONS (EmailJS) =====================
   ملاحظة: المتصفح لا يستطيع إرسال بريد إلكتروني مباشرة، لذلك تم استخدام خدمة EmailJS
   (مجانية لعدد محدود من الرسائل شهرياً) لإرسال إشعار بريدي عند إصدار استشارة جديدة.
   لتفعيل الإرسال الفعلي: أنشئ حساباً مجانياً على https://www.emailjs.com، أضف خدمة بريد (Gmail مثلاً)،
   أنشئ قالب رسالة (Template) يحتوي على متغير {{message}}، ثم ضع القيم الثلاث أدناه (Service ID, Template ID, Public Key). */
const EMAILJS_CONFIG = { serviceId: 'YOUR_SERVICE_ID', templateId: 'YOUR_TEMPLATE_ID', publicKey: 'YOUR_PUBLIC_KEY' };
const NOTIFY_EMAIL = 'm2200022@gmail.com';
async function sendNewConsultationEmail(c){
  if(!window.emailjs || EMAILJS_CONFIG.serviceId==='YOUR_SERVICE_ID'){ console.warn('EmailJS غير مُعدّ بعد — تم تخطي إرسال البريد'); return; }
  try{
    await window.emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
      to_email: NOTIFY_EMAIL,
      message: 'لديك استشارة جديدة رقمها ' + (c.number || c.id)
    }, EMAILJS_CONFIG.publicKey);
  }catch(e){ console.error('email send failed', e); }
}
/* ===================== STATE & STORAGE ===================== */
const OCR_MODEL = 'claude-sonnet-4-6';
let state = {
  authenticated: false,
  role: null,
  view: 'dashboard',
  detailId: null,
  editingId: null,
  consultations: [],
  messages: [],
  audit: [],
  adminProfile: { name:'الإدارة', email:'', phone:'', username:'admin', password:'admin123' },
  consultantProfile: { name:'د. عقيل محمد المقطري', email:'', phone:'', username:'aqeel', password:'aqeel123' },
  logoUrl: '',
  sidebarOpen: false,
  filters: { q:'', status:'', priority:'' },
  selectedMonth: '',
  rangeFrom: '',
  rangeTo: '',
  reportType: 'received',
  suggestions: [],
  unseenMessages: 0
};
let editDetails = false;
let imgViewerIndex = 0, imgZoom = 1, imgRot = 0;

function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buildAnswerGreeting(c){
  const name = (c && c.askerName ? c.askerName : '').trim();
  return `بسم الله الرحمن الرحيم<br>الأخ الفاضل ${name?esc(name):''}<br>السلام عليكم ورحمة الله وبركاته.<br><br>`;
}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return fmtDate(iso)+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return 0; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function hoursSince(iso){ if(!iso) return 0; return (Date.now()-new Date(iso).getTime())/3600000; }
function effectivePriority(c){
  if(c.status!=='تحت الإجابة') return c.priority;
  if(c.priority==='مستعجل') return 'مستعجل';
  return hoursSince(c.assignedAt||c.createdAt) >= 72 ? 'مستعجل' : 'عادي';
}
function isCritical(c){
  if(c.status!=='تحت الإجابة') return false;
  return hoursSince(c.assignedAt||c.createdAt) >= 96;
}
function daysElapsedDisplay(c){
  if(c.archivedAt) return Math.max(0, Math.floor((new Date(c.archivedAt)-new Date(c.assignedAt||c.createdAt))/86400000));
  return daysSince(c.assignedAt||c.createdAt);
}
function rowColorClass(c){
  if(c.status !== 'تحت الإجابة') return '';
  return effectivePriority(c)==='مستعجل' ? 'row-urgent-full' : 'row-normal-open';
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ if(!key) return ''; const [y,m]=key.split('-'); const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']; return names[parseInt(m,10)-1]+' '+y; }

async function storeGet(key, shared){
  try{
    const ref = doc(db, APP_STATE_COLLECTION, key);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data().value : null;
  }catch(e){ console.error('firestore get failed', key, e); showSyncError(e); return null; }
}
async function storeSet(key, value, shared){
  try{
    const ref = doc(db, APP_STATE_COLLECTION, key);
    await setDoc(ref, { value, updatedAt: Date.now() });
    return true;
  }catch(e){ console.error('firestore set failed', key, e); showSyncError(e); return false; }
}
let syncErrorShown = false;
function showSyncError(e){
  if(syncErrorShown) return; // avoid spamming the user with repeated banners
  syncErrorShown = true;
  const code = (e && e.code) || '';
  let msg = 'تعذّر حفظ/مزامنة البيانات مع قاعدة البيانات.';
  if(code === 'permission-denied'){
    msg = 'تعذّر الحفظ: صلاحيات قاعدة البيانات (Firestore Rules) تمنع الكتابة/القراءة. يجب تعديل قواعد الأمان (Rules) من لوحة تحكم Firebase.';
  } else if(code === 'unavailable' || code === 'failed-precondition'){
    msg = 'تعذّر الحفظ: تحقق من اتصال الإنترنت، أو من أن قاعدة بيانات Firestore تم إنشاؤها فعلياً في مشروع Firebase.';
  }
  const bar = document.createElement('div');
  bar.textContent = '⚠️ ' + msg + ' (التفاصيل في console المتصفح)';
  bar.style.cssText = 'position:fixed; top:0; right:0; left:0; z-index:9999; background:#c0392b; color:#fff; padding:10px 16px; font-size:13px; text-align:center; font-weight:700;';
  document.body.appendChild(bar);
  setTimeout(()=>{ syncErrorShown = false; bar.remove(); }, 15000);
}

async function loadAll(){
  const c = await storeGet('consultations_v2', true);
  const m = await storeGet('messages_v2', true);
  const a = await storeGet('audit_v2', true);
  const p = await storeGet('profiles_v2', true);
  const b = await storeGet('branding_v1', true);
  const sg = await storeGet('suggestions_v1', true);
  state.consultations = c ? JSON.parse(c) : [];
  state.messages = m ? JSON.parse(m) : [];
  state.audit = a ? JSON.parse(a) : [];
  state.suggestions = sg ? JSON.parse(sg) : [];
  if(p){
    const parsed = JSON.parse(p);
    state.adminProfile = Object.assign({}, state.adminProfile, parsed.admin||{});
    state.consultantProfile = Object.assign({}, state.consultantProfile, parsed.consultant||{});
  } else { await persistProfiles(); }
  if(b){ const parsedB = JSON.parse(b); state.logoUrl = parsedB.logoUrl || ''; }
}
async function persistConsultations(){ await storeSet('consultations_v2', JSON.stringify(state.consultations), true); }
async function persistMessages(){ await storeSet('messages_v2', JSON.stringify(state.messages), true); }
async function persistAudit(){ await storeSet('audit_v2', JSON.stringify(state.audit), true); }
async function persistProfiles(){ await storeSet('profiles_v2', JSON.stringify({admin:state.adminProfile, consultant:state.consultantProfile}), true); }
async function persistBranding(){ await storeSet('branding_v1', JSON.stringify({logoUrl: state.logoUrl}), true); }
async function persistSuggestions(){ await storeSet('suggestions_v1', JSON.stringify(state.suggestions), true); }

function actorName(){ return state.role==='admin' ? (state.adminProfile.name||'الإدارة') : (state.consultantProfile.name||'المستشار'); }
function logAudit(action){
  state.audit.unshift({ ts: nowIso(), actor: actorName(), action, device: (navigator.userAgent||'').slice(0,60) });
  persistAudit();
}

/* ===================== DERIVED HELPERS ===================== */
function statusKey(c){
  if(c.status==='تحت الإجابة'){
    const hours = hoursSince(c.assignedAt||c.createdAt);
    const autoUrgent = hours >= 72;   // 3 أيام — تتحول تلقائياً إلى مستعجلة
    const urgent = c.priority==='مستعجل' || autoUrgent;
    const late = hours >= 36;          // يوم ونصف — تصبح متأخرة
    if(urgent && late) return 'مستعجلة ومتأخرة';
    if(late) return 'متأخرة';
    if(urgent) return 'مستعجلة';
    return 'جديدة';
  }
  return c.status;
}
const STATUS_DISPLAY = {
  'جديدة':'جديدة', 'مستعجلة':'مستعجلة', 'متأخرة':'متأخرة', 'مستعجلة ومتأخرة':'مستعجلة ومتأخرة',
  'تمت الإجابة':'تمت الإجابة',
  'معتمدة':'تم إرسالها للموقع الرسمي للتدقيق والنشر',
  'قيد الطباعة':'تم النشر',
  'مؤرشفة':'تم إغلاق الاستشارة',
  'اعتذار':'اعتذار عن الإجابة'
};
const STAMP_MAP = {
  'جديدة':{cls:'st-new', label:'جديدة 📥'},
  'مستعجلة':{cls:'st-urgent-pending', label:'مستعجلة 🔴'},
  'متأخرة':{cls:'st-overdue', label:'متأخرة ⏰'},
  'مستعجلة ومتأخرة':{cls:'st-overdue', label:'مستعجلة ومتأخرة ⏰🔴'},
  'تمت الإجابة':{cls:'st-answered', label:'تمت الإجابة ✅'},
  'معتمدة':{cls:'st-approved', label: STATUS_DISPLAY['معتمدة']+' ✔️'},
  'قيد الطباعة':{cls:'st-printing', label: STATUS_DISPLAY['قيد الطباعة']+' 🌐'},
  'مؤرشفة':{cls:'st-archived', label: STATUS_DISPLAY['مؤرشفة']+' 🔒'},
  'اعتذار':{cls:'st-apology', label:'اعتذار عن الإجابة 🚫'}
};
function statusStamp(c){ return STAMP_MAP[statusKey(c)] || {cls:'st-new', label:c.status}; }
function isOverdue(c){ const k = statusKey(c); return k==='متأخرة' || k==='مستعجلة ومتأخرة'; }

function visibleConsultations(){
  let list = state.consultations.slice();
  if(state.role==='consultant'){
    list = list.filter(c => (c.assignedTo||[]).includes(state.consultantProfile.name));
  }
  const f = state.filters;
  if(f.q){
    const q = f.q.trim();
    list = list.filter(c => [c.number,c.subject,c.askerName,c.question].some(v=>(v||'').includes(q)));
  }
  if(f.status) list = list.filter(c => statusKey(c) === f.status);
  if(f.priority) list = list.filter(c => effectivePriority(c) === f.priority);
  return list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
}
function computeStats(list){
  const s = { total:list.length, new:0, urgentPending:0, overdue:0, pendingTotal:0, answered:0, approved:0, printing:0, archived:0, apology:0, urgent:0, normal:0 };
  list.forEach(c=>{
    const k = statusKey(c);
    if(k==='جديدة') s.new++;
    if(k==='مستعجلة') s.urgentPending++;
    if(k==='متأخرة' || k==='مستعجلة ومتأخرة') s.overdue++;
    if(['جديدة','مستعجلة','متأخرة','مستعجلة ومتأخرة'].includes(k)) s.pendingTotal++;
    if(k==='تمت الإجابة') s.answered++;
    if(k==='معتمدة') s.approved++;
    if(k==='قيد الطباعة') s.printing++;
    if(k==='مؤرشفة') s.archived++;
    if(k==='اعتذار') s.apology++;
    if(effectivePriority(c)==='مستعجل') s.urgent++; else s.normal++;
  });
  return s;
}
function avgResponseDays(list){
  const done = list.filter(c=>c.answeredAt);
  if(!done.length) return '—';
  const total = done.reduce((sum,c)=> sum + Math.max(0,(new Date(c.answeredAt)-new Date(c.assignedAt||c.createdAt))/86400000), 0);
  return (total/done.length).toFixed(1);
}
function complianceRate(list){
  const done = list.filter(c=>c.answeredAt);
  if(!done.length) return '—';
  const onTime = done.filter(c=>{
    return (new Date(c.answeredAt)-new Date(c.assignedAt||c.createdAt))/86400000 <= 1.5;
  }).length;
  return Math.round((onTime/done.length)*100) + '%';
}
function monthlyCounts(list){
  const counts = {};
  list.forEach(c=>{ const k = monthKey(c.createdAt); counts[k]=(counts[k]||0)+1; });
  return Object.entries(counts).sort((a,b)=> a[0]<b[0]?1:-1).slice(0,6).reverse();
}
async function unseenMessagesFor(role){
  const raw = await storeGet('lastseen_msgs_'+role, false);
  const last = raw ? new Date(raw) : null;
  return state.messages.filter(m => m.from !== role && (!last || new Date(m.ts) > last)).length;
}
async function refreshUnseenMessages(){ state.unseenMessages = await unseenMessagesFor(state.role); }

/* ===================== RENDER ===================== */
function el(id){ return document.getElementById(id); }
function setView(view, extra){
  state.view = view;
  editDetails = false; replyingTo = null; state.editingId = null;
  if(extra) Object.assign(state, extra);
  state.sidebarOpen = false;
  render();
}
function iconFor(view){ return {dashboard:'🏠', list:'📋', add:'➕', closed:'🔒', reports:'🖨️', monthly:'📅', messages:'✉️', audit:'🕵️', settings:'⚙️'}[view] || '•'; }
function navItems(){
  if(state.role==='admin'){
    return [ ['dashboard','لوحة التحكم'], ['list','الاستشارات'], ['add','إضافة استشارة'], ['closed','الاستشارات المغلقة'], ['reports','التقارير'], ['messages','الرسائل'], ['audit','سجل العمليات'], ['settings','إدارة المستخدمين والصلاحيات'] ];
  }
  return [ ['dashboard','لوحة التحكم'], ['list','استشاراتي'], ['closed','استشاراتي المغلقة'], ['reports','التقارير'], ['messages','الرسائل'] ];
}
function pendingBadgeCount(){
  if(state.role==='consultant'){
    return state.consultations.filter(c=>(c.assignedTo||[]).includes(state.consultantProfile.name) && c.status==='تحت الإجابة').length;
  }
  return state.consultations.filter(c=>c.status==='تحت الإجابة').length;
}
function layoutShell(){

function renderLogin(){
  return `
  <div class="login-screen">
    <div class="login-card">
      ${state.logoUrl ? `<img src="${state.logoUrl}" class="login-logo">` : `<div class="brand-seal login-seal">است</div>`}

      <div class="field" style="text-align:right;"><label>كلمة المرور</label><input type="password" id="loginPass" placeholder="كلمة المرور"></div>
      <div id="loginError" class="login-error hidden"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center; margin-top:6px;">دخول</button>
    </div>
  </div>`;
}
function bindLoginEvents(){
  const doLogin = ()=>{
    const u = (el('loginUser').value||'').trim();
    const p = (el('loginPass').value||'').trim();
    const err = el('loginError');
    if(u && p && u===state.adminProfile.username && p===state.adminProfile.password){
      state.authenticated = true; state.role = 'admin'; state.view = 'dashboard';
      render(); refreshUnseenMessages().then(()=>{ render(); checkAndShowEntryModal(); });
      return;
    }
    if(u && p && u===state.consultantProfile.username && p===state.consultantProfile.password){
      state.authenticated = true; state.role = 'consultant'; state.view = 'dashboard';
      render(); refreshUnseenMessages().then(()=>{ render(); checkAndShowEntryModal(); });
      return;
    }
    err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    err.classList.remove('hidden');
  };
  el('loginBtn').addEventListener('click', doLogin);
  [el('loginUser'), el('loginPass')].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
}
function logout(){
  state.authenticated = false; state.role = null; state.view = 'dashboard';
  render();
}
function renderContent(){
  const c = el('content');
  if(state.view==='dashboard') c.innerHTML = state.role==='admin' ? renderAdminDashboard() : renderConsultantDashboard();
  else if(state.view==='list') c.innerHTML = renderList();
  else if(state.view==='closed') c.innerHTML = renderClosedList();
  else if(state.view==='add') c.innerHTML = renderAddForm();
  else if(state.view==='detail') c.innerHTML = renderDetail();
  else if(state.view==='reports') c.innerHTML = renderReports();
  else if(state.view==='monthly') c.innerHTML = renderMonthlyReport(visibleConsultations(), 'تقاريري الشهرية');
  else if(state.view==='messages') c.innerHTML = renderMessages();
  else if(state.view==='audit') c.innerHTML = renderAudit();
  else if(state.view==='settings') c.innerHTML = renderSettings();
  bindContentEvents();
  if(state.view==='messages'){ storeSet('lastseen_msgs_'+state.role, nowIso(), false).then(()=>{ state.unseenMessages=0; }); }
}

/* ---------- Smart paste parser ---------- */
function parseConsultationPaste(text){
  const t = String(text||'').replace(/\r/g,'');
  const result = {number:'', asker:'', country:'', gender:'', age:'', marital:'', subject:'', question:''};
  if(!t.trim()) return result;
  const lines = t.split('\n').map(l=>l.trim()).filter(Boolean);

  const numMatch = t.match(/رقم\s*ال[إا]?\s*ستشارة[^\d]{0,10}(\d{3,})/);
  if(numMatch) result.number = numMatch[1];

  function findLabelLine(labelPattern){
    const labelRe = new RegExp('^(?:'+labelPattern+')[؟]?$');
    for(let i=0;i<lines.length;i++){
      const line = lines[i];
      const sep = line.includes(':') ? ':' : (line.includes('：') ? '：' : null);
      if(!sep) continue;
      const idx = line.indexOf(sep);
      const left = line.slice(0,idx).trim();
      const right = line.slice(idx+1).trim();
      if(labelRe.test(left)) return {index:i, value:right};
      if(labelRe.test(right)) return {index:i, value:left};
    }
    return null;
  }
  function findLabelIndexBare(labelPattern){
    const labelRe = new RegExp('^(?:'+labelPattern+')[؟]?$');
    for(let i=0;i<lines.length;i++){
      const core = lines[i].replace(/[:：]/g,'').trim();
      if(labelRe.test(core)) return i;
    }
    return -1;
  }

  const asker = findLabelLine('السائل'); if(asker) result.asker = asker.value;
  const country = findLabelLine('البلد'); if(country) result.country = country.value;
  const gender = findLabelLine('الجنس'); if(gender) result.gender = gender.value;
  const age = findLabelLine('العمر'); if(age) result.age = age.value;
  const marital = findLabelLine('الحالة\\s*ال[إا]جتماعية'); if(marital) result.marital = marital.value;
  const subject = findLabelLine('العنوان'); if(subject) result.subject = subject.value;

  let qStart = -1, firstPart = '';
  const qLine = findLabelLine('السؤال');
  if(qLine){ qStart = qLine.index; firstPart = qLine.value; }
  else{ qStart = findLabelIndexBare('السؤال'); }
  if(qStart !== -1){
    const qLines = [];
    if(firstPart) qLines.push(firstPart);
    for(let i=qStart+1;i<lines.length;i++){
      const core = lines[i].replace(/[:：]/g,'').trim();
      if(/^(الإجابة|الاجابة)$/.test(core)) break;
      qLines.push(lines[i]);
    }
    result.question = qLines.join('\n').trim();
  }
  return result;
}
function applyPastedData(){
  const raw = el('f_rawpaste'); if(!raw) return;
  const text = raw.value;
  if(!text.trim()) { toast('الرجاء لصق البيانات أولاً'); return; }
  const p = parseConsultationPaste(text);
  const fNumber = el('f_number'), fAsker = el('f_asker'), fCountry = el('f_country'), fGender = el('f_gender'), fAge = el('f_age'), fMarital = el('f_marital'), fSubject = el('f_subject'), fQuestion = el('f_question');
  if(fNumber && p.number && !fNumber.value.trim()) fNumber.value = p.number;
  if(fAsker && p.asker) fAsker.value = p.asker;
  if(fCountry && p.country) fCountry.value = p.country;
  if(fGender && p.gender) fGender.value = p.gender;
  if(fAge && p.age) fAge.value = p.age;
  if(fMarital && p.marital) fMarital.value = p.marital;
  if(fSubject && p.subject) fSubject.value = p.subject;
  if(fQuestion && p.question) fQuestion.value = p.question;
  toast('تمت تعبئة الحقول تلقائياً — يرجى مراجعتها');
}

  if(!c.answeredAt) return '—';

async function downloadReportPdf(){
  const area = el('rangeReportPrintArea') || el('monthlyReportPrintArea');
  if(!area){ toast('تعذّر إيجاد محتوى التقرير'); return; }
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    toast('تعذّر تحميل مكتبة إنشاء PDF — تحقق من الاتصال بالإنترنت'); return;
  }
  toast('جارٍ إنشاء ملف PDF…');
  try{
    const canvas = await html2canvas(area, { scale:2, backgroundColor:'#ffffff', onclone:(doc)=>{ doc.querySelectorAll('.no-print').forEach(elx=>elx.style.display='none'); } });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth - 40;
    const imgHeight = canvas.height * (imgWidth / canvas.width);
    let heightLeft = imgHeight;
    let position = 20;
    pdf.addImage(imgData, 'PNG', 20, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - 40);
    while(heightLeft > 0){
      position = heightLeft - imgHeight + 20;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 20, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - 40);
    }
    pdf.save('تقرير_'+Date.now()+'.pdf');
    logAudit('تنزيل تقرير PDF');
  }catch(e){
    console.error('PDF export failed', e);
    toast('حدث خطأ أثناء إنشاء PDF');
  }
}

let copiedFormat = null;
function copyFormatFromSelection(){
  const editor = el('answerEditor'); if(!editor) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed){ toast('حدد نصاً منسّقاً أولاً لنسخ تنسيقه'); return; }
  let node = sel.anchorNode;
  if(node && node.nodeType===3) node = node.parentElement;
  if(!node || !editor.contains(node)){ toast('حدد نصاً داخل مربع الإجابة'); return; }
  const cs = window.getComputedStyle(node);
  copiedFormat = {
    bold: parseInt(cs.fontWeight)>=600,
    italic: cs.fontStyle==='italic',
    underline: cs.textDecorationLine.includes('underline'),
    fontFamily: cs.fontFamily.replace(/["']/g,'').split(',')[0].trim(),
    fontSize: parseInt(cs.fontSize)
  };
  const btn = el('formatPainterBtn'); if(btn) btn.classList.add('active');
  toast('تم نسخ التنسيق 🖌️ — الآن حدد النص الذي تريد تطبيقه عليه');
  const applyOnce = ()=>{
    applyCopiedFormat();
    editor.removeEventListener('mouseup', applyOnce);
    editor.removeEventListener('keyup', applyOnce);
  };
  editor.addEventListener('mouseup', applyOnce);
  editor.addEventListener('keyup', applyOnce);
}
function applyCopiedFormat(){
  if(!copiedFormat) return;
  const editor = el('answerEditor'); if(!editor) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed){ copiedFormat=null; const btn=el('formatPainterBtn'); if(btn) btn.classList.remove('active'); return; }
  editor.focus();
  if(document.queryCommandState('bold') !== copiedFormat.bold) document.execCommand('bold', false, null);
  if(document.queryCommandState('italic') !== copiedFormat.italic) document.execCommand('italic', false, null);
  if(document.queryCommandState('underline') !== copiedFormat.underline) document.execCommand('underline', false, null);
  if(copiedFormat.fontFamily) document.execCommand('fontName', false, copiedFormat.fontFamily);
  if(copiedFormat.fontSize) applyFontSize(copiedFormat.fontSize);
  toast('تم تطبيق التنسيق');
  copiedFormat = null;
  const btn = el('formatPainterBtn'); if(btn) btn.classList.remove('active');
}
function applyFontFamily(fontName){
  const editor = el('answerEditor'); if(!editor) return;
  editor.focus();
  document.execCommand('fontName', false, fontName);
}
function applyFontSize(px){
  const editor = el('answerEditor'); if(!editor) return;
  editor.focus();
  document.execCommand('fontSize', false, '7');
  editor.querySelectorAll('font[size="7"]').forEach(f=>{
    f.removeAttribute('size');
    f.style.fontSize = px+'px';
  });
}
async function loadDeviceFonts(){
  const select = el('editorFontFamily'); if(!select) return;
  if(!('queryLocalFonts' in window)){
    toast('متصفحك لا يدعم قراءة خطوط الجهاز مباشرة (هذه الميزة تجريبية وتعمل حالياً على Chrome/Edge على الحاسوب فقط) — استخدم القائمة الحالية بدلاً من ذلك');
    return;
  }
  try{
    const fonts = await window.queryLocalFonts();
    const families = Array.from(new Set(fonts.map(f=>f.family))).sort((a,b)=>a.localeCompare(b));
    let added = 0;
    families.forEach(fam=>{
      if(![...select.options].some(o=>o.value===fam)){
        const opt = document.createElement('option'); opt.value = fam; opt.textContent = fam; select.appendChild(opt); added++;
      }
    });
    toast('تم تحميل '+added+' خطاً إضافياً من جهازك — اختره من القائمة');
  }catch(e){
    console.error('queryLocalFonts failed', e);
    toast('تعذّرت قراءة خطوط الجهاز — قد تكون رفضت إذن الوصول، أو المتصفح لا يدعم هذه الميزة');
  }
}

/* ---------- Reports export ---------- */
function exportCsv(set){
  let list = visibleConsultations();
  if(set==='answered') list = list.filter(c=>['تمت الإجابة','معتمدة','قيد الطباعة'].includes(c.status));
  if(set==='overdue') list = list.filter(isOverdue);
  if(set==='urgent') list = list.filter(c=>effectivePriority(c)==='مستعجل');
  downloadCsv(list, 'تقرير_الاستشارات_'+set+'.csv');
  logAudit('تصدير تقرير: '+set);
}
function exportMonthCsv(){
  const list = visibleConsultations();
  const sel = state.selectedMonth || (Array.from(new Set(list.map(c=>monthKey(c.createdAt)))).sort().reverse()[0]||'');
  const filtered = sel ? list.filter(c=>monthKey(c.createdAt)===sel) : list;
  downloadCsv(filtered, 'التقرير_الشهري_'+(sel||'all')+'.csv');
  logAudit('تصدير تقرير شهري: '+sel);
}
function exportRangeCsv(){
  const from = state.rangeFrom, to = state.rangeTo;
  let list = visibleConsultations();
  if(from) list = list.filter(c=> (c.date||c.createdAt.slice(0,10)) >= from);
  if(to) list = list.filter(c=> (c.date||c.createdAt.slice(0,10)) <= to);
  if(state.reportType === 'financial'){
    const unit = 50;
    const headers = ['رقم الاستشارة','تاريخ الاستشارة','المبلغ المالي (ر.ق)'];
    const rows = list.map(c=>[c.number, c.date, unit]);
    rows.push(['','الإجمالي', list.length*unit]);
    const csv = '\uFEFF' + [headers, ...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'تقرير_مالي_'+(from||'بداية')+'_إلى_'+(to||'اليوم')+'.csv'; a.click();
    logAudit('تصدير تقرير مالي: '+from+' - '+to);
    return;
  }
  if(state.reportType === 'answered') list = list.filter(c=> c.answeredAt && (!from || c.answeredAt.slice(0,10)>=from) && (!to || c.answeredAt.slice(0,10)<=to));
  downloadCsv(list, 'تقرير_الفترة_'+(from||'بداية')+'_إلى_'+(to||'اليوم')+'.csv');
  logAudit('تصدير تقرير حسب الفترة: '+from+' - '+to);
}
function downloadCsv(list, filename){
  const headers = ['رقم','التاريخ','الموضوع','الأولوية','الحالة','تاريخ الوصول','عدد الأيام'];
  const rows = list.map(c=>{ const k=statusKey(c); return [c.number,c.date,c.subject,effectivePriority(c), (STATUS_DISPLAY[k]||k), fmtDate(c.assignedAt||c.createdAt), daysElapsedDisplay(c)]; });
  const csv = '\uFEFF' + [headers, ...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function exportBackup(){
  const payload = { consultations: state.consultations, messages: state.messages, audit: state.audit, profiles: {admin: state.adminProfile, consultant: state.consultantProfile}, logoUrl: state.logoUrl, suggestions: state.suggestions, exportedAt: nowIso() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'نسخة_احتياطية_'+Date.now()+'.json'; a.click();
  logAudit('تنزيل نسخة احتياطية');
}
async function restoreBackup(){
  const input = el('restoreFile'); const file = input.files[0]; if(!file) return;
  if(!confirm('سيتم استبدال جميع البيانات الحالية بالنسخة المستوردة. هل أنت متأكد؟')){ input.value=''; return; }
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    state.consultations = payload.consultations || [];
    state.messages = payload.messages || [];
    state.audit = payload.audit || [];
    state.suggestions = payload.suggestions || [];
    if(payload.profiles){ state.adminProfile = Object.assign({}, state.adminProfile, payload.profiles.admin||{}); state.consultantProfile = Object.assign({}, state.consultantProfile, payload.profiles.consultant||{}); }
    if(payload.logoUrl!==undefined) state.logoUrl = payload.logoUrl;
    await persistConsultations(); await persistMessages(); await persistAudit(); await persistProfiles(); await persistBranding(); await persistSuggestions();
    toast('تمت الاستعادة بنجاح'); render();
  }catch(e){ toast('ملف غير صالح'); }
}
