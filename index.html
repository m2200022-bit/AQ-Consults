      <li>${ic('bell')}<span class="grow"><b>إشعارات المتصفح</b><div class="muted">${notif==='granted'?'مفعّلة — تصلك تنبيهات الاستشارات والرسائل الجديدة':notif==='denied'?'محظورة — فعّلها من إعدادات المتصفح':notif==='unsupported'?'غير مدعومة في هذا المتصفح':'غير مفعّلة'}</div></span>${notif==='default'?`<button class="btn btn-sm btn-primary" data-action="enable-notif">تفعيل</button>`:''}</li>
      <li>${ic('moon')}<span class="grow"><b>المظهر</b><div class="muted">الوضع الحالي: ${themeNow()==='dark'?'ليلي':'نهاري'}</div></span><button class="btn btn-sm" data-action="toggle-theme">تبديل</button></li>
      <li>${ic('refresh-cw')}<span class="grow"><b>المزامنة</b><div class="muted">${outbox.length?outbox.length+' تعديل محفوظ على الجهاز بانتظار الإرسال':'كل التعديلات متزامنة مع قاعدة البيانات'}</div></span>${outbox.length?`<button class="btn btn-sm" data-action="flush-now">إرسال الآن</button>`:''}</li>
    </ul>
  </div></div>
  ${snippetsPanel()}
  ${admin?`<div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>${ic('palette')}الهوية والإعدادات العامة</h3></div><div class="panel-body">
      <div class="field"><label class="lbl">شعار البرنامج</label><div class="btn-row">${state.settings.logoUrl?`<img src="${esc(state.settings.logoUrl)}" style="width:52px;height:52px;border-radius:12px;object-fit:cover;border:1px solid var(--border)">`:''}<label class="btn btn-sm" style="cursor:pointer">${ic('upload')}رفع شعار<input type="file" id="logoFile" accept="image/*" hidden></label>${state.settings.logoUrl?`<button class="btn btn-sm btn-ghost" data-action="remove-logo">${ic('x')}إزالة</button>`:''}</div></div>
      <div class="field"><label class="lbl">اسم الموقع في قالب الإجابة</label><input type="text" id="setSite" value="${esc(state.settings.siteName)}"></div>
      <div class="field"><label class="lbl">قيمة الاستشارة الواحدة (ر.ق) — للتقرير المالي</label><input type="number" id="setPrice" value="${esc(state.settings.unitPrice)}" min="0"></div>
      <button class="btn btn-primary" data-action="save-settings">${ic('save')}حفظ الإعدادات</button>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>${ic('database')}البيانات والنسخ الاحتياطي</h3></div><div class="panel-body">
      <div class="field"><label class="lbl">سعة مستند الاستشارات (${(u.bytes/1024).toFixed(0)} ك.ب من 1024)</label>
        <div class="sla-track" style="margin:4px 0"><div class="sla-fill" style="width:${u.pct}%;background:${u.pct>80?'var(--danger)':u.pct>60?'var(--warn)':'var(--ok)'}"></div></div>
        <div class="muted">${u.pct}% مستخدمة${u.pct>70?' — يُنصح بتنزيل نسخة احتياطية وأرشفة الاستشارات القديمة قريباً':''}</div></div>
      <p class="muted">النسخة الاحتياطية متوافقة مع النظام السابق ويمكن استعادتها في أي منهما.</p>
      <div class="btn-row"><button class="btn" data-action="export-backup">${ic('download')}تنزيل نسخة احتياطية</button><label class="btn" style="cursor:pointer">${ic('upload')}استعادة من نسخة<input type="file" id="restoreFile" accept="application/json" hidden></label></div>
    </div></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>${ic('lightbulb')}المقترحات والملاحظات</h3></div><div class="panel-body">
    <div class="inline-form" style="margin-bottom:10px"><input type="text" id="sugInput" placeholder="اكتب مقترحاً جديداً…"><button class="btn btn-primary" data-action="add-sug">${ic('plus')}إضافة</button></div>
    ${(state.settings.suggestions||[]).length?`<ul class="list-plain">${state.settings.suggestions.map((s,i)=>`<li>${ic('dot')}<span class="grow">${esc(s)}</span><button class="btn btn-ghost btn-icon btn-sm" data-action="edit-sug" data-idx="${i}" title="تعديل">${ic('pencil')}</button><button class="btn btn-ghost btn-icon btn-sm" data-action="del-sug" data-idx="${i}" title="حذف">${ic('trash-2')}</button></li>`).join('')}</ul>`:emptyHtml('lightbulb','لا توجد مقترحات')}
  </div></div>`:''}`;
}
function snippetsPanel(){
  return `<div class="panel"><div class="panel-head"><h3>${ic('quote')}مكتبة المقاطع الجاهزة</h3><span class="muted">آيات وأدعية وعبارات متكررة تُدرج في الإجابة بنقرة</span></div><div class="panel-body">
    ${state.snippets.length?`<ul class="list-plain">${state.snippets.map((s,i)=>`<li>${ic('quote','ico-sm')}<span class="grow"><b>${esc(s.title)}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.text)}</div></span><button class="btn btn-ghost btn-icon btn-sm" data-action="edit-snippet" data-idx="${i}" title="تعديل">${ic('pencil')}</button><button class="btn btn-ghost btn-icon btn-sm" data-action="del-snippet" data-idx="${i}" title="حذف">${ic('trash-2')}</button></li>`).join('')}</ul>`:emptyHtml('quote','لا توجد مقاطع بعد')}
    <button class="btn btn-outline" data-action="add-snippet" style="margin-top:10px">${ic('plus')}إضافة مقطع</button>
  </div></div>`;
}
async function snippetModal(s){
  return openModal({ icon:'quote', title:s?'تعديل المقطع':'مقطع جديد', body:`<div class="field"><label class="lbl">العنوان</label><input type="text" id="snT" value="${esc(s?s.title:'')}" placeholder="مثال: دعاء ختامي"></div><div class="field"><label class="lbl">النص</label><textarea id="snX" style="min-height:140px;font-family:var(--font-text);font-size:17px">${esc(s?s.text:'')}</textarea></div><div id="snErr" class="muted" style="color:var(--danger)"></div>`,
    actions:[{label:'حفظ', cls:'btn-primary', value:()=>{ const t=$('snT').value.trim(), x=$('snX').value.trim(); if(!t||!x){ $('snErr').textContent='العنوان والنص مطلوبان'; return undefined; } return {title:t, text:x}; }},{label:'إلغاء', result:null}] });
}
async function saveSnippets(items){ const r=await enqueue({ k:'sn', replace:items }); afterCommit(r,'تم حفظ المقاطع'); }
async function saveProfile(role){
  const g=f=>($('pf_'+role+'_'+f)?.value||'').trim();
  const old=state.profiles[role];
  const np={ name:g('name')||old.name, email:g('email'), phone:g('phone'), username:g('username')||old.username, password:g('password')||old.password };
  const other=state.profiles[role==='admin'?'consultant':'admin'];
  if(np.username.toLowerCase()===String(other.username||'').toLowerCase()){ toast('اسم المستخدم مستخدم للحساب الآخر — اختر اسماً مختلفاً','warn'); return; }
  const next={ ...state.profiles, [role]:np };
  const r=await enqueue({ k:'p', replace:next });
  if(role==='consultant' && np.name!==old.name) enqueue({ k:'c', rename:{ from:old.name, to:np.name }, silent:true });
  if(role===state.user.role) lsSet('aq_session', JSON.stringify({ role, h:hashCred(np.username, np.password) }));
  afterCommit(r,'تم الحفظ'); logAudit('تحديث بيانات '+(role==='admin'?'المدير':'المستشار'));
}
function resizeImage(file, max){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h){ if(w>max){ h=Math.round(h*max/w); w=max; } } else if(h>max){ w=Math.round(w*max/h); h=max; } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/png')); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
function exportBackup(){
  const payload={ consultations:raw.c||[], messages:raw.m||[], audit:raw.a||[], profiles:state.profiles, logoUrl:state.settings.logoUrl, suggestions:raw.s||[], settings:raw.st||{}, snippets:state.snippets, exportedAt:nowIso(), version:3 };
  const el=document.createElement('a'); el.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})); el.download='نسخة_احتياطية_'+todayStr()+'.json'; el.click();
  logAudit('تنزيل نسخة احتياطية');
}
async function restoreBackup(file){
  let payload; try{ payload=JSON.parse(await file.text()); }catch(e){ toast('ملف غير صالح','err'); return; }
  const n=(payload.consultations||[]).length;
  const ok=await confirmModal({ title:'استعادة نسخة احتياطية', text:'سيتم استبدال جميع البيانات الحالية بالنسخة المستوردة ('+n+' استشارة). هل أنت متأكد؟', confirm:'استعادة', icon:'upload', danger:true });
  if(!ok) return;
  if(Array.isArray(payload.consultations)) enqueue({ k:'c', replace:payload.consultations, silent:true });
  if(Array.isArray(payload.messages)) enqueue({ k:'m', replace:payload.messages, silent:true });
  if(Array.isArray(payload.audit)) enqueue({ k:'a', replace:payload.audit, silent:true });
  if(Array.isArray(payload.suggestions)) enqueue({ k:'s', replace:payload.suggestions, silent:true });
  if(payload.profiles) enqueue({ k:'p', replace:{ admin:{...state.profiles.admin, ...(payload.profiles.admin||{})}, consultant:{...state.profiles.consultant, ...(payload.profiles.consultant||{})} }, silent:true });
  if(payload.logoUrl!==undefined) enqueue({ k:'b', replace:{ logoUrl:payload.logoUrl||'' }, silent:true });
  if(payload.settings) enqueue({ k:'st', replace:payload.settings, silent:true });
  const r=await (Array.isArray(payload.snippets) ? enqueue({ k:'sn', replace:payload.snippets }) : flushWait('none'));
  softRefresh(); toast('تمت الاستعادة بنجاح'); logAudit('استعادة نسخة احتياطية ('+n+' استشارة)');
}

/* ===================== EVENT DELEGATION ===================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; });
const ACTIONS={
  'login': doLogin, 'logout': logout, 'save-profile': el=>saveProfile(el.dataset.role), 'flush-now': ()=>{ flush(false).then(()=>renderContent(true)); },
  'toggle-pass': el=>{ const i=$(el.dataset.for); if(i){ i.type=i.type==='password'?'text':'password'; el.innerHTML=ic(i.type==='password'?'eye':'eye-off'); refreshIcons(); } },
  'toggle-sidebar': ()=>{ state.sidebarOpen=!state.sidebarOpen; $('sidebar')?.classList.toggle('open', state.sidebarOpen); document.querySelector('.scrim')?.classList.toggle('on', state.sidebarOpen); },
  'toggle-collapse': ()=>{ state.sidebarCollapsed=!state.sidebarCollapsed; lsSet('aq_sidebar', state.sidebarCollapsed?'1':'0'); $('sidebar')?.classList.toggle('collapsed', state.sidebarCollapsed); },
  'toggle-theme': ()=>{ const n=themeNow()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); lsSet('aq_theme',n); document.querySelector('meta[name=theme-color]').setAttribute('content', n==='dark'?'#241619':'#7A1F2E'); const b=$('themeBtn'); if(b){ b.innerHTML=ic(n==='dark'?'sun':'moon'); refreshIcons(); } if(state.view==='settings') renderContent(true); },
  'kpi': el=>{ const v=el.dataset.view; if(v==='reports') return; if(v==='list'){ state.filters={q:'',stage:'',flag:el.dataset.flag||''}; } setView(v); },
  'back': ()=> setView(state.prevView && state.prevView!=='detail' ? state.prevView : 'list'),
  'open-audit-check': openAuditCheck,
  'closed-more': ()=>{ state.closedLimit+=50; refreshClosedBody(); },
  'edit-row': el=> setView('add',{editingId:el.dataset.id}),
  'delete-row': el=>{ const c=state.consultations.find(x=>x.id===el.dataset.id); if(c) softDelete(c); },
  'restore': el=>{ const c=state.consultations.find(x=>x.id===el.dataset.id); if(c) restoreConsult(c); },
  'perma-delete': el=>{ const c=state.consultations.find(x=>x.id===el.dataset.id); if(c) permaDelete(c); },
  'parse-paste': applyPastedData, 'save-consult': saveConsult,
  'cancel-add': ()=> setView(state.editingId?'detail':'list', state.editingId?{detailId:state.editingId}:undefined),
  'edit-consult': ()=> setView('add',{editingId:state.detailId}),
  'delete-consult': ()=>{ const c=current(); if(c) softDelete(c); },
  'download-word': downloadWord,
  'copy-question': async ()=>{ const c=current(); try{ await navigator.clipboard.writeText(c.question||''); toast('تم نسخ السؤال'); }catch(e){ toast('تعذّر النسخ','warn'); } },
  'approve': ()=>{ const c=current(); if(c) approveAnswer(c); },
  'publish': ()=>{ const c=current(); if(c) publishConsult(c); },
  'copy-publish': copyPublish, 'copy-answer': copyAnswer,
  'return-edit': ()=>{ const c=current(); if(c) returnForEdit(c); },
  'reopen-closed': ()=>{ const c=current(); if(c) reopenClosed(c); },
  'reopen-declined': ()=>{ const c=current(); if(c) reopenDeclined(c); },
  'close-declined': ()=>{ const c=current(); if(c) closeDeclined(c); },
  'send-note': sendNote,
  'toggle-sim': el=>{ state.expandedSim[el.dataset.id]=!state.expandedSim[el.dataset.id];
    const box=$('simPanel'); const c=current(); if(box&&c){ const tmp=document.createElement('div'); tmp.innerHTML=similarHtml(c); box.replaceWith(tmp.firstElementChild); refreshIcons(); } },
  'view-version': el=> viewVersion(el.dataset.ts), 'restore-version': el=> restoreVersion(el.dataset.ts),
  'submit-answer': submitAnswer, 'save-draft': saveDraft, 'decline': declineAnswer,
  'snippets': toggleSnippets,
  'insert-snippet': el=>{ const s=state.snippets[+el.dataset.idx]; $('snipPop')?.remove(); if(s) insertTextAtCursor(s.text); },
  'format-painter': formatPainter, 'voice': toggleVoice, 'refresh-greeting': refreshGreeting, 'load-fonts': loadDeviceFonts,
  'range-preset': el=> setRangePreset(el.dataset.p),
  'export-csv': exportReportCsv, 'export-month': exportMonthCsv, 'report-pdf': reportPdf, 'print': ()=>window.print(),
  'send-msg': sendMsg,
  'reply': el=>{ state.replyTo=el.dataset.id; renderContent(true); setTimeout(()=>$('msgInput')?.focus(),30); },
  'cancel-reply': ()=>{ state.replyTo=null; renderContent(true); },
  'install-app': async ()=>{ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; renderContent(true); },
  'add-snippet': async ()=>{ const s=await snippetModal(null); if(s) saveSnippets([...state.snippets, s]); },
  'edit-snippet': async el=>{ const i=+el.dataset.idx; const s=await snippetModal(state.snippets[i]); if(s){ const items=state.snippets.slice(); items[i]=s; saveSnippets(items); } },
  'del-snippet': async el=>{ const i=+el.dataset.idx; if(await confirmModal({ title:'حذف المقطع', text:'حذف «'+state.snippets[i].title+'»؟', confirm:'حذف', danger:true, icon:'trash-2' })){ const items=state.snippets.slice(); items.splice(i,1); saveSnippets(items); } },
  'save-settings': async ()=>{ const r=await enqueue({ k:'st', replace:{ ...(raw.st||{}), siteName:($('setSite').value||'').trim()||'شبكة إسلام ويب', unitPrice:Math.max(0,+$('setPrice').value||0) } }); afterCommit(r,'تم حفظ الإعدادات'); logAudit('تحديث الإعدادات العامة'); },
  'remove-logo': async ()=>{ const r=await enqueue({ k:'b', replace:{ logoUrl:'' } }); afterCommit(r,'تمت إزالة الشعار'); },
  'export-backup': exportBackup,
  'add-sug': async ()=>{ const t=($('sugInput').value||'').trim(); if(!t) return; const r=await enqueue({ k:'s', replace:[...(state.settings.suggestions||[]), t] }); afterCommit(r,'تمت الإضافة'); },
  'edit-sug': async el=>{ const i=+el.dataset.idx; const t=await promptModal({ title:'تعديل المقترح', value:state.settings.suggestions[i], required:true }); if(t){ const a=state.settings.suggestions.slice(); a[i]=t; const r=await enqueue({ k:'s', replace:a }); afterCommit(r,'تم الحفظ'); } },
  'del-sug': async el=>{ const i=+el.dataset.idx; const a=state.settings.suggestions.slice(); a.splice(i,1); const r=await enqueue({ k:'s', replace:a }); afterCommit(r,'تم الحذف'); }
};
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-action],[data-nav],[data-open]');
  if(!t || t.closest('#modalRoot')) return;
  if(t.dataset.nav){ e.preventDefault(); setView(t.dataset.nav); return; }
  if(t.dataset.open && !t.dataset.action){ e.preventDefault(); state.prevView = state.view==='detail' ? state.prevView : state.view; setView('detail',{ detailId:t.dataset.open, expandedSim:{} }); return; }
  const fn=ACTIONS[t.dataset.action]; if(fn){ e.preventDefault(); fn(t,e); }
});
document.addEventListener('mousedown', e=>{ if(e.target.closest('.editor-toolbar .tb-btn')) e.preventDefault(); });
document.addEventListener('click', e=>{
  const b=e.target.closest('.editor-toolbar [data-cmd]'); if(!b) return;
  restoreRange(); document.execCommand(b.dataset.cmd, false, null); onEditorInput();
});
const INPUTS={
  fq: el=>{ state.filters.q=el.value; refreshListBody(); },
  closedQ: el=>{ state.closedQ=el.value; state.closedLimit=50; refreshClosedBody(); },
  f_number: ()=>checkDup(),
  answerEditor: ()=> onEditorInput()
};
document.addEventListener('input', e=>{ const id=e.target.id || (e.target.closest && e.target.closest('#answerEditor') ? 'answerEditor' : ''); if(INPUTS[id]) INPUTS[id](e.target, e); });
const CHANGES={
  fstage: el=>{ state.filters.stage=el.value; refreshListBody(); },
  fflag: el=>{ state.filters.flag=el.value; refreshListBody(); },
  rFrom: el=>{ state.report.from=el.value; el.blur(); renderContent(true); },
  rTo: el=>{ state.report.to=el.value; el.blur(); renderContent(true); },
  rType: el=>{ state.report.type=el.value; el.blur(); renderContent(true); },
  rMonth: el=>{ state.report.month=el.value; el.blur(); renderContent(true); },
  edFont: el=>{ restoreRange(); document.execCommand('fontName', false, el.value); onEditorInput(); },
  edSize: el=> applyFontSize(el.value),
  logoFile: async el=>{ const f=el.files[0]; if(!f) return; const url=await resizeImage(f,240); const r=await enqueue({ k:'b', replace:{ logoUrl:url } }); afterCommit(r,'تم حفظ الشعار'); logAudit('تحديث الشعار'); },
  restoreFile: el=>{ const f=el.files[0]; el.value=''; if(f) restoreBackup(f); }
};
document.addEventListener('change', e=>{
  if(CHANGES[e.target.id]) CHANGES[e.target.id](e.target, e);
});
document.addEventListener('keydown', e=>{
  const id=e.target.id;
  if(e.key==='Enter' && !e.shiftKey){
    if(id==='loginUser'||id==='loginPass'){ e.preventDefault(); doLogin(); return; }
    if(['bsName','bsUser','bsPass','bsPass2'].includes(id)){ e.preventDefault(); doBootstrap(); return; }
    if(id==='msgInput'){ e.preventDefault(); sendMsg(); return; }
    if(id==='noteInput'){ e.preventDefault(); sendNote(); return; }
    if(id==='sugInput'){ e.preventDefault(); ACTIONS['add-sug'](); return; }
  }
  if($('answerEditor') && (e.ctrlKey||e.metaKey)){
    if(e.key==='Enter'){ e.preventDefault(); submitAnswer(); }
    else if(e.key==='s'||e.key==='S'){ e.preventDefault(); saveDraft(); }
  }
});
document.addEventListener('paste', e=>{
  if(e.target.id==='f_rawpaste'){ setTimeout(applyPastedData, 30); return; }
  const ed=e.target.closest && e.target.closest('#answerEditor');
  if(ed){
    e.preventDefault();
    const cd=e.clipboardData||window.clipboardData;
    const html=cd.getData('text/html'), text=cd.getData('text/plain');
    const clean = html ? sanitizeHtml(html).replace(/style="[^"]*"/g, m=> /text-align|font-weight|font-style|text-decoration/.test(m) ? m : '') : esc(text).replace(/\r\n|\r|\n/g,'<br>');
    document.execCommand('insertHTML', false, clean);
    onEditorInput();
  }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.user) refreshSla(); });

/* ===================== PWA ===================== */
/* التثبيت كتطبيق يتم عبر بيانات manifest المضمّنة أعلى الصفحة */
window.__aq = { state, sanitizeHtml, parseConsultationPaste, similarTo, flags, slaInfo, raw, get outbox(){ return outbox; } };
startSync();
